version: '3.8'

services:
  # 1. PostgreSQL with pgvector for relational persistence & semantic search
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny-assistant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lenny_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service & Agent Layer
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lenny-assistant-backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lenny_assistant
      DEFAULT_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 3. React / Vite Frontend & Sandboxed Artifact Viewer
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lenny-assistant-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
